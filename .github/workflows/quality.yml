name: Quality checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m compileall -q engine api ui tests

      - name: Lint and format check (Ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Validate rule files are valid JSON
        run: |
          for file in rules/*.json; do
            python -m json.tool "$file" > /dev/null
          done

      - name: Run deterministic engine tests
        run: python -m unittest discover -s tests -v
